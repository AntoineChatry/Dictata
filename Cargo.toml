[package]
name = "dictata"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[dependencies]
arboard = "3"
cpal = "0.18.1"
eframe = "0.34.3"
enigo = "0.6"
# 0.8 minimum: below that, the Windows release-detection loop busy-spins a
# whole CPU core for the entire key hold (push-to-talk). See upstream #178.
global-hotkey = "0.8"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
indexmap = { version = "2.14.0", features = ["serde"] }
num_cpus = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tray-icon = "0.21"
whisper-rs = "0.16.0"

# --- ASR engine module (src/engine) ---
# Unified engine error type: pure Rust, light.
thiserror = "2"
# Optional engine backends, each isolating its heavy native deps behind a
# feature. All off by default: the default (whisper/vulkan) build pulls none.
parakeet-rs = { version = "0.3", optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
], optional = true }
realfft = { version = "3.5", optional = true }
kaldi-native-fbank = { version = "0.1", optional = true }

[features]
# GPU transcription. Enabled by default; build with --no-default-features
# for a CPU-only binary that does not require the Vulkan SDK.
default = ["vulkan"]
vulkan = ["whisper", "whisper-rs/vulkan"]
# Engine backends. `whisper-rs` is a hard dependency of the app itself
# (transcriber.rs), so `whisper` only gates the engine's whisper backend module,
# not the crate — hence `[]`, not `dep:whisper-rs`.
whisper = []
parakeet = ["dep:parakeet-rs"]
parakeet-directml = ["parakeet", "parakeet-rs/directml"]
resample = []
vad = ["dep:ort"]
diarize = ["parakeet", "parakeet-rs/sortformer"]
sensevoice = ["dep:ort", "dep:realfft"]
moonshine = ["dep:ort"]
zipformer = ["dep:ort", "dep:kaldi-native-fbank"]

[profile.release]
opt-level = 3
lto = "fat"        # cross-crate inlining (whisper-rs, resampling): smaller, faster
codegen-units = 1  # better optimisation at the cost of a slower build
strip = true       # drop symbols: lighter shipped binary
# NB: `panic = "abort"` is intentionally NOT set. streaming.rs relies on
# std::panic::catch_unwind to keep the UI from hanging if the worker panics;
# aborting on panic would defeat that safety net.

[build-dependencies]
# Embeds assets/dictata.ico and the version metadata into the exe (build.rs).
# Not gated behind cfg(windows): a platform-specific build-dependency is
# resolved against the *host*, so gating it would break build.rs when
# cross-compiling to Windows from another OS. build.rs checks the target
# itself and does nothing when it is not Windows.
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
